[URL Rewrite]
# ========== 国内 App 开屏 / 关键广告 URL 拦截（需 MitM） ==========
# 通用开屏关键词（相对安全）
(?i)/splash - reject
(?i)/startup - reject
(?i)/launchad - reject
(?i)/openad - reject
(?i)/getSplash - reject
(?i)/splashScreen - reject
(?i)/ad/splash - reject
(?i)/api/v\d+/splash - reject
(?i)/api/ad/ - reject
(?i)/ads/ - reject
(?i)/advert - reject
(?i)/advertise - reject
(?i)/promotion/display - reject
(?i)/promotion/feed - reject

# 爱奇艺
^https?://(t7z|kjp)\.cupid\.iqiyi\.com/mixer - reject
^https?://.*\.iqiyi\.com/.*/ad - reject
^https?://.*\.iqiyi\.com/.*/splash - reject

# 哔哩哔哩
^https?://app\.bilibili\.com/x/v2/splash/(list|show) - reject
^https?://app\.bilibili\.com/x/v2/show/ad - reject

# 微博
^https?://.*\.weibo\.(cn|com)/.*ad - reject
^https?://.*\.sina\.(cn|com\.cn)/.*ad - reject

# 美团 / 外卖
^https?://wmapi\.meituan\.com/api/v\d+/loadInfo - reject
^https?://.*\.meituan\.net/.*/ad - reject

# 京东
^https?://.*\.jd\.com/.*/ad - reject
^https?://im-x\.jd\.com - reject

# 高德 / 地图类
^https?://.*\.amap\.com/.*/ad - reject
^https?://optimus-ads\.amap\.com - reject

# 12306
^https?://ad\.12306\.cn - reject

# 优酷
^https?://.*\.youku\.com/.*/ad - reject
^https?://iyes\.youku\.com - reject

# 喜马拉雅
^https?://adse\.ximalaya\.com - reject
^https?://.*\.ximalaya\.com/.*/ad - reject

# 知乎（部分）
^https?://api\.zhihu\.com/fringe/ad - reject
^https?://www\.zhihu\.com/api/v\d+/search/related_queries - reject

# 其他常见
^https?://.*\.ott\.cibntv\.net/.*\.mp4\?sid= - reject
(?i)\bvmind\.qqvideo\.tc\.qq\.com/[\w\/\.-]+[a-z]\d+\.mp4\? - reject

# 海外常见广告路径
(?i)/pagead/ - reject
(?i)/adsystem/ - reject
(?i)/adserver/ - reject
(?i)/adserve/ - reject
(?i)/banner/ad - reject
(?i)/ad/banner - reject

[MITM]
# 必须开启 HTTPS 解密才能让 URL Rewrite 和开屏脚本生效
hostname = %APPEND% *.iqiyi.com, *.youku.com, *.bilibili.com, *.weibo.cn, *.weibo.com, *.sina.cn, *.sina.com.cn, *.meituan.com, *.meituan.net, *.jd.com, *.amap.com, *.ximalaya.com, *.zhihu.com, *.baidu.com, *.qq.com, ad.12306.cn, *.ott.cibntv.net, *.cupid.iqiyi.com, wmapi.meituan.com, im-x.jd.com, optimus-ads.amap.com, adse.ximalaya.com, api.zhihu.com, www.zhihu.com
